<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
<title>NICU events and Medicaid coverage</title>
<style>body{margin:0;font:15px system-ui,sans-serif;color:#193244;background:#f3f6f7}#message{max-width:570px;margin:15vh auto;padding:25px;line-height:1.6}h1{font-size:26px}#bar{display:none;padding:10px 18px;background:#193244;color:white;font-size:12px;align-items:center;justify-content:space-between;gap:15px}button{font:inherit;cursor:pointer;background:white;color:#193244;border:0;border-radius:4px;padding:7px 12px}iframe{display:block;width:100%;height:calc(100dvh - 51px);border:0}#status{margin-left:10px}</style></head><body>
<div id="bar"><span>NICU events and Medicaid coverage · Access requires the complete link. Forward only to intended recipients.</span><span><button id="copy">Copy share link</button><span id="status" aria-live="polite"></span></span></div>
<main id="message"><h1>NICU events and Medicaid coverage</h1><p id="state">Checking the access link…</p></main>
<script>
(async()=>{
 const state=document.getElementById('state'),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const raw=location.hash.slice(1);
 if(!/^[A-Za-z0-9_-]{43}$/.test(raw)){state.textContent='This map requires the complete share link, including its access key. Ask the sender for the full link.';return;}
 try{
  const key=await crypto.subtle.importKey('raw',b64(raw.replace(/-/g,'+').replace(/_/g,'/')+'='),{name:'AES-GCM'},false,['decrypt']);
  const response=await fetch('map.enc.json',{cache:'no-store'});
  if(!response.ok)throw Error('Unavailable');
  const payload=await response.json();
  const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  const frame=document.createElement('iframe');frame.title='NICU event feasibility map';
  frame.setAttribute('sandbox','allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox');
  frame.srcdoc=new TextDecoder().decode(bytes);
  document.getElementById('message').remove();document.getElementById('bar').style.display='flex';document.body.appendChild(frame);
  document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById('status').textContent='Copied';}catch{document.getElementById('status').textContent='Copy the full browser address.';}};
 }catch{state.textContent='This link could not unlock the map. Check that you have the complete, current link from the sender.';}
})();
</script></body></html>
